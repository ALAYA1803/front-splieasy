<div class="forgot-password-container">
  <div class="forgot-password-box">
    <a routerLink="/" class="brand-logo mb-4">
      <img src="assets/images/logo.png" alt="SplitEasy Logo">
    </a>
    <div class="login-header">
      <app-language-switcher></app-language-switcher>
    </div>
    <h1 class="form-title">{{ 'RESET.TITLE' | translate }}</h1>
    <p class="form-description">{{ 'RESET.DESCRIPTION' | translate }}</p>

    <form class="mt-4" [formGroup]="resetPasswordForm" (ngSubmit)="updatePassword()">
      <div class="form-group">
        <label for="password" class="form-label">{{ 'RESET.NEW_PASSWORD_LABEL' | translate }}</label>
        <div class="input-group">
          <i class="bi bi-lock-fill input-icon"></i>
          <input id="password" type="password" class="form-control" formControlName="password" />
        </div>

        <!-- Requisitos en vivo -->
        <div class="password-requirements mt-2">
          <p class="mb-1 small text-muted">Requisitos de la contraseña:</p>
          <ul class="requirements-list">
            <li [class.valid]="isMinLength" [class.invalid]="!isMinLength">
              <i class="bi" [ngClass]="{ 'bi-check-circle': isMinLength, 'bi-x-circle': !isMinLength }"></i>
              Al menos 8 caracteres
            </li>
          </ul>
        </div>
      </div>

      <div class="form-group">
        <label for="repeatPassword" class="form-label">{{ 'RESET.CONFIRM_PASSWORD_LABEL' | translate }}</label>
        <div class="input-group">
          <i class="bi bi-lock-fill input-icon"></i>
          <input id="repeatPassword" type="password" class="form-control" formControlName="repeatPassword" />
        </div>
        <div *ngIf="resetPasswordForm.hasError('mismatch') && resetPasswordForm.get('repeatPassword')?.touched" class="invalid-feedback d-block">
          Las contraseñas no coinciden.
        </div>
        <!-- Indicador en tiempo real de coincidencia -->
        <div *ngIf="repeatPasswordControl?.value" class="small mt-1" [class.text-success]="passwordsMatch" [class.text-danger]="!passwordsMatch">
          {{ passwordsMatch ? 'Las contraseñas coinciden.' : 'Las contraseñas no coinciden.' }}
        </div>
      </div>

      <button type="submit" class="btn btn-login w-100 mt-3" [disabled]="resetPasswordForm.invalid || isSubmitting">
        <span *ngIf="!isSubmitting">{{ 'RESET.BUTTON' | translate }}</span>
        <span *ngIf="isSubmitting">Guardando...</span>
      </button>
    </form>

    <div *ngIf="message" class="alert alert-danger mt-3">
      {{ message }}
    </div>

  </div>
</div>
